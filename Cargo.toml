[package]
name = "candle-playground"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
candle-core = { version = "0.11.0", path = "../candle/candle-core" }
candle-datasets = { version = "0.11.0", path = "../candle/candle-datasets" }
candle-nn = { version = "0.11.0", path = "../candle/candle-nn" }
clap = { version = "4.6.4", features = ["derive"] }
itertools = "0.15.0"
# candle allocates a fresh zeroed buffer per op with no pooling; glibc mmaps and
# munmaps the big ones, so training spends most of its time faulting in pages
mimalloc = { version = "0.1", default-features = false }
rand = "0.10.2"
tokenizers = "0.23.1"
tqdm = "0.8.0"
